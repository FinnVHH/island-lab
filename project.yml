name: IslandLab
options:
  bundleIdPrefix: com.finnvhh.islandlab
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  IslandLab:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: IslandLabActivity
        embed: true
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Island Lab
        NSSupportsLiveActivities: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finnvhh.islandlab
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  IslandLabActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    info:
      path: Generated/Activity-Info.plist
      properties:
        CFBundleDisplayName: Island Lab Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finnvhh.islandlab.activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  IslandLab:
    build:
      targets:
        IslandLab: all
